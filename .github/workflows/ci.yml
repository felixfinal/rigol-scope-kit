name: offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.28'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv lock --check --python '${{ matrix.python }}'
      - run: uv run --frozen --no-sync --python .venv/bin/python python -m unittest discover -s tests -q
      - run: uv run --frozen --no-sync --python .venv/bin/python python examples/mcp_discovery.py
      - run: uv run --frozen --no-sync --python .venv/bin/python python tools/verify_public.py --strict
      - run: uv build --python .venv/bin/python --no-build-isolation --out-dir dist
      - run: uv run --frozen --no-sync --python .venv/bin/python twine check dist/*
      - run: uv run --frozen --no-sync --python .venv/bin/python python tools/verify_public.py --strict --dist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-python-${{ matrix.python }}
          path: dist/*
