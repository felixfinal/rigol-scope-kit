[project]
name = "rigol-scope-kit"
version = "0.6.1"
description = "Bounded LAN SCPI tools and Agent Skill for RIGOL MHO900 oscilloscopes"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["oscilloscope", "rigol", "scpi", "mcp", "agent-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["mcp>=1.27,<2", "numpy>=2,<3", "matplotlib>=3.10,<4", "pydantic>=2,<3"]

[project.urls]
Repository = "https://github.com/felixfinal/rigol-scope-kit"
Issues = "https://github.com/felixfinal/rigol-scope-kit/issues"
Documentation = "https://github.com/felixfinal/rigol-scope-kit/blob/main/README.zh-CN.md"

[project.scripts]
rigol-scope = "rigol_scope.cli:main"
rigol-scope-mcp = "rigol_scope.mcp_server:main"
rigol-scope-skill = "rigol_scope.skill_bundle:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["hatchling==1.27.0", "twine>=6.1,<7"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/skills", "/tests", "/docs", "/examples", "/tools",
    "/config/*.example.*", "/scripts/check_readonly.py", "/scripts/check_mcp_readonly.py",
    "/README.md", "/README.zh-CN.md", "/CHANGELOG.md", "/CONTRIBUTING.md",
    "/LICENSE", "/NOTICE", "/uv.lock", "/.python-version", "/.gitignore", "/.github",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rigol_scope"]

[tool.hatch.build.targets.wheel.force-include]
"skills/rigol-oscilloscope" = "rigol_scope/_bundled_skill/rigol-oscilloscope"
